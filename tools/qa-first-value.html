<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BrainiLab · Local result preview</title><link rel="stylesheet" href="../assets/css/site.css"><link rel="stylesheet" href="../assets/css/post-game.css"><style>body{margin:0;background:#f7f6fc}.preview-toolbar{max-width:680px;margin:20px auto;padding:0 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:14px sans-serif}.preview-toolbar button{padding:10px;min-height:44px;font:inherit}main{padding:8px 16px 32px}dialog{max-width:360px;padding:24px;border:1px solid #d9d7e7;border-radius:16px;color:#30296f}dialog::backdrop{background:#211e3855}dialog button{min-height:44px;padding:10px 16px}</style></head><body>
<nav class="preview-toolbar" aria-label="Local preview controls"><strong>Local preview</strong><button type="button" id="preview-guest">Guest</button><button type="button" id="preview-member">Signed in</button><button type="button" id="preview-reset">Reset “Not now”</button></nav>
<main id="preview-result"></main>
<dialog id="preview-dialog"><h2>Save your progress</h2><p>This preview stops here. The live button opens BrainiLab’s existing free account form.</p><button type="button" id="preview-close">Back to result</button></dialog>
<script>let previewStatus='guest';window.BrainiData={authState:()=>({status:previewStatus}),dateForDailyNumber:()=>null};window.BrainiAuth={open:async()=>document.querySelector('#preview-dialog').showModal()};</script>
<script src="../assets/js/icon-system.js"></script><script src="../assets/js/post-game.js"></script>
<script>
function renderPreview(){window.BrainiPostGame.mount(document.querySelector('#preview-result'),{gameId:'mathrush',name:'Math Rush',result:{correct:7,total:10,score:700,accuracy:70,timeSec:60,clientResultId:'local-preview'},metrics:[{label:'Accuracy',value:'70%'}],next:{href:'/games/math-rush/',label:'Play again'},focus:false});}
document.querySelector('#preview-guest').onclick=()=>{previewStatus='guest';renderPreview()};document.querySelector('#preview-member').onclick=()=>{previewStatus='authenticated';renderPreview()};document.querySelector('#preview-reset').onclick=()=>{sessionStorage.removeItem('brainilab_account_invite_dismissed_v1');location.reload()};document.querySelector('#preview-close').onclick=()=>document.querySelector('#preview-dialog').close();renderPreview();
</script></body></html>
